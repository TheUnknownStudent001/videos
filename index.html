<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Content unavailable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff;
    }

    #player {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }

    #player iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #message {
      display: none;
      min-height: 100vh;
      box-sizing: border-box;
      place-items: center;
      padding: 24px;
      color: #37352f;
      background: #ffffff;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
    }

    .error-card {
      width: min(420px, 100%);
    }

    .error-code {
      margin-bottom: 8px;
      color: #9b9a97;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .error-card h1 {
      margin: 0 0 10px;
      color: #37352f;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
    }

    .error-card p {
      margin: 0;
      color: #787774;
      font-size: 15px;
      line-height: 1.55;
    }
  </style>
</head>

<body>
  <div id="player"></div>
  <div id="message"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("video");

    const isEmbedded = window.self !== window.top;

    const player = document.getElementById("player");
    const message = document.getElementById("message");

    function showUnavailableMessage() {
      player.remove();

      message.innerHTML = `
        <div class="error-card">
          <div class="error-code">404</div>
          <h1>Content unavailable</h1>
          <p>This content is no longer available or the link may be invalid.</p>
        </div>
      `;

      message.style.display = "grid";
    }

    if (!videoId) {
      showUnavailableMessage();
    } else if (!isEmbedded) {
      showUnavailableMessage();
    } else {
      const iframe = document.createElement("iframe");

      iframe.src =
        "https://kinescope.io/embed/" + encodeURIComponent(videoId);

      iframe.allow =
        "autoplay; fullscreen; picture-in-picture; encrypted-media; " +
        "gyroscope; accelerometer; clipboard-write; screen-wake-lock;";

      iframe.allowFullscreen = true;

      player.appendChild(iframe);
    }
  </script>
</body>
</html>
