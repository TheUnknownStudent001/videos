<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>K Embed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #player {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }

    #message {
      min-height: 100vh;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 24px;
      text-align: center;
    }

    #message-content {
      max-width: 420px;
    }

    #message h2 {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 600;
    }

    #message p {
      margin: 0;
      color: #b8b8b8;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div id="player"></div>

  <script>
    const isEmbedded = window.self !== window.top;

    function showMessage(title, text) {
      document.body.innerHTML = `
        <main id="message">
          <div id="message-content">
            <h2>${title}</h2>
            <p>${text}</p>
          </div>
        </main>
      `;
    }

    if (!isEmbedded) {
      showMessage(
        "Video unavailable",
        "Please open this video from the Notion page where it was shared."
      );
    } else {
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get("video");

      if (!videoId) {
        showMessage(
          "No video specified",
          "Return to the Notion page and open the video again."
        );
      } else {
        const iframe = document.createElement("iframe");

        iframe.src =
          "https://kinescope.io/embed/" + encodeURIComponent(videoId);

        iframe.allow =
          "autoplay; fullscreen; picture-in-picture; encrypted-media; " +
          "gyroscope; accelerometer; clipboard-write; screen-wake-lock;";

        iframe.frameBorder = "0";
        iframe.allowFullscreen = true;

        iframe.style.cssText =
          "position:absolute;top:0;left:0;width:100%;height:100%;border:0;";

        document.getElementById("player").appendChild(iframe);
      }
    }
  </script>
</body>
</html>
